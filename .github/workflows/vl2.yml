# Build the two mod archives and publish them.
#
# tools/build-vl2.sh bakes the backend address into the packaged settings.cs, so
# a .vl2 is only useful once it is built for a particular deployment. This
# workflow builds the ones for tnb.k8s.henrik.si and releases them.
#
# A release is a tag, and nothing else.
#
# This used to publish one release per commit to main, tagged build-<sha>. That
# made every merge a release, which is a strange thing to ask a player to choose
# between: the download page listed a version nobody had decided to ship, and
# "the newest build" and "the version we mean" were not the same thing. Now a
# release happens when somebody names one --
#
#     git tag -a v1.1.0 -m "..." && git push origin v1.1.0
#
# -- and the tag is the version. Nothing here creates a tag; the tag is what
# starts it.
#
# A published tag is still never rewritten. The point of a download link someone
# recorded is that it keeps handing out the bytes they recorded it for, and
# GitHub's own pointer at the newest release,
#
#   https://github.com/henrikhasell/TribesNextBrowser/releases/latest/download/TNBrowser.vl2
#
# moves without any tag having to.
#
# Pushes to main no longer build. Pull requests still do, without publishing:
# that check is what stops a broken build-vl2.sh from being discovered at the
# moment somebody is trying to cut a release.
#
# HTTPS is deliberate. Stock Torque's HTTPObject spoke plain HTTP only; the
# TribesNext client patch reimplements it on libcurl and ships a CA bundle, and
# every client this mod runs on is patched by definition.

name: vl2

on:
  push:
    # Tags only, and no paths filter with them: a tag push carries no useful
    # commit range to filter against, so a filter here would skip the release
    # rather than narrow it.
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'TNBrowser/**'
      - 'TNBrowserServer/**'
      - 'tools/build-vl2.sh'
      - '.github/workflows/vl2.yml'
  workflow_dispatch:

env:
  HOST: https://tnb.k8s.henrik.si

# A tag run is never worth cancelling -- there is only ever one, and it is the
# release. On a pull request every push but the last is a build nobody will
# look at.
concurrency:
  group: vl2-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./tools/build-vl2.sh --host "$HOST"

      # build-vl2.sh already fails when it cannot find a default to rewrite, but
      # that check passes on a file that never made it into the archive. Read
      # the setting back out of the packed bytes instead, which is the only form
      # anyone will actually install.
      - name: Check the endpoint was baked in
        run: |
          set -euo pipefail
          check() {
            local archive="$1" entry="$2" var="$3"
            local got
            got=$(unzip -p "dist/$archive" "$entry" | sed -n "s/.*\\\$$var *= *\"\([^\"]*\)\".*/\1/p" | head -1)
            if [ "$got" != "$HOST" ]; then
              echo "$archive: \$$var is \"$got\", expected \"$HOST\"" >&2
              exit 1
            fi
            echo "$archive: \$$var = $got"
          }
          check TNBrowser.vl2       tnbrowser/settings.cs TNB::Host
          check TNBrowserServer.vl2 tnbserver/settings.cs TNBS::Host

      - uses: actions/upload-artifact@v4
        with:
          name: vl2
          path: dist/*.vl2
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    # Creating a release writes to the repository.
    permissions:
      contents: write

    steps:
      # Publish the artifact the previous job produced rather than rebuilding,
      # so what is released is byte-for-byte what was checked.
      - uses: actions/download-artifact@v4
        with:
          name: vl2
          path: dist

      # --latest is what moves the /releases/latest/ pointer, and it is what the
      # website's download page follows. A re-run of an already published tag is
      # a no-op rather than a failure: rewriting a published release is the one
      # thing this must not do.
      #
      # No --target. The tag already exists -- pushing it is what started this
      # run -- so naming a commit here could only disagree with it.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "$TAG is already published, and published releases are not rewritten."
            exit 0
          fi
          gh release create "$TAG" dist/*.vl2 \
            --repo "$REPO" \
            --latest \
            --title "$TAG" \
            --notes "Built from \`$SHA\`, pointing at $HOST.

          **TNBrowser.vl2** is the client package: the community screens, mail and clan browser. Drop it into \`GameData/base/\` and start the game normally -- no \`-mod\` flag, and it works under whichever mod you play. A TribesNext-patched client is required.

          **TNBrowserServer.vl2** is the game-server package, which shows clan tags for connecting players. Same install, into the dedicated server's own \`GameData/base/\`. Server operators want this one; players do not need it.

          **A package and the backend it points at must be the same major version.** The v2 protocol is not the v1 one, and a v1 mod talking to a v2 server is told to update rather than left with empty panes.

          Both have the backend address baked in, so there is nothing to configure after the install. To point one somewhere else, put \`\$TNB::Host = \"...\";\` in a loose \`autoexec.cs\` beside the archive."
