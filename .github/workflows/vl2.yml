# Build the two mod archives and publish them.
#
# tools/build-vl2.sh bakes the backend address into the packaged settings.cs, so
# a .vl2 is only useful once it is built for a particular deployment. This
# workflow builds the ones for tnb.k8s.henrik.si and releases them.
#
# One release per commit, tagged build-<sha>, and a tag once pushed is never
# touched again: the point of a download link someone recorded is that it keeps
# handing out the bytes they recorded it for. The stable link for anyone who
# just wants the current build is GitHub's own pointer at the newest release,
#
#   https://github.com/henrikhasell/TribesNextBrowser/releases/latest/download/TNBrowser.vl2
#
# which moves without any tag having to.
#
# HTTPS is deliberate. Stock Torque's HTTPObject spoke plain HTTP only; the
# TribesNext client patch reimplements it on libcurl and ships a CA bundle, and
# every client this mod runs on is patched by definition.

name: vl2

on:
  push:
    branches: [main]
    paths:
      - 'TNBrowser/**'
      - 'TNBrowserServer/**'
      - 'tools/build-vl2.sh'
      - '.github/workflows/vl2.yml'
  pull_request:
    paths:
      - 'TNBrowser/**'
      - 'TNBrowserServer/**'
      - 'tools/build-vl2.sh'
  workflow_dispatch:

env:
  HOST: https://tnb.k8s.henrik.si

# Nothing on main is shared between runs -- each commit gets its own tag -- so
# only branch builds are worth cancelling, and there every push but the last is
# a build nobody will look at.
concurrency:
  group: vl2-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./tools/build-vl2.sh --host "$HOST"

      # build-vl2.sh already fails when it cannot find a default to rewrite, but
      # that check passes on a file that never made it into the archive. Read
      # the setting back out of the packed bytes instead, which is the only form
      # anyone will actually install.
      - name: Check the endpoint was baked in
        run: |
          set -euo pipefail
          check() {
            local archive="$1" entry="$2" var="$3"
            local got
            got=$(unzip -p "dist/$archive" "$entry" | sed -n "s/.*\\\$$var *= *\"\([^\"]*\)\".*/\1/p" | head -1)
            if [ "$got" != "$HOST" ]; then
              echo "$archive: \$$var is \"$got\", expected \"$HOST\"" >&2
              exit 1
            fi
            echo "$archive: \$$var = $got"
          }
          check TNBrowser.vl2       tnbrowser/settings.cs TNB::Host
          check TNBrowserServer.vl2 tnbserver/settings.cs TNBS::Host

      - uses: actions/upload-artifact@v4
        with:
          name: vl2
          path: dist/*.vl2
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    # Creating a release writes to the repository.
    permissions:
      contents: write

    steps:
      # Publish the artifact the previous job produced rather than rebuilding,
      # so what is released is byte-for-byte what was checked.
      - uses: actions/download-artifact@v4
        with:
          name: vl2
          path: dist

      # --latest is what moves the /releases/latest/ pointer, and it is the only
      # thing here that moves at all. A re-run of an already published commit is
      # a no-op rather than a failure: the tag exists, and rewriting it is the
      # one thing this must not do.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="build-${SHA:0:7}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "$TAG is already published, and published tags are not rewritten."
            exit 0
          fi
          gh release create "$TAG" dist/*.vl2 \
            --repo "$REPO" \
            --target "$SHA" \
            --latest \
            --title "$TAG" \
            --notes "Built from \`$SHA\`, pointing at $HOST.

          **TNBrowser.vl2** is the client package: the community screens, mail and clan browser. Drop it into \`GameData/<MOD>/\` and launch with \`-mod <MOD>\`. A TribesNext-patched client is required.

          **TNBrowserServer.vl2** is the game-server package, which shows clan tags for connecting players. Server operators want this one; players do not need it.

          Both have the backend address baked in, so there is nothing to configure after the install. To point one somewhere else, put \`\$TNB::Host = \"...\";\` in a loose \`autoexec.cs\` beside the archive."
